[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64", "setuptools_scm>=8"]

[dependency-groups]
dev = [
  "cfchecker>=4.1.0",
  "mypy>=1.15.0",
  "myst-parser>=4.0.1",
  "pandas-stubs>=1.4.0",
  "pre-commit>=4.3.0",
  "py>=1.11.0",
  "pydata-sphinx-theme>=0.16.1",
  "pytest>=7.0",
  "pytest-cov>=5.0",
  "setuptools>=64.0",
  "shapely>=2.1",
  "sphinx-autoapi>=3.6.0"
]

[project]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering"
]
# NOTE: some dependencies are not explicitly imported in the code, but we
# rely on the packages being installed or we need to set minimum versions
dependencies = [
  "attrs>=24.0",
  "dask>=2024.6",
  "flox>=0.10",
  "numcodecs>=0.15.1",
  "numpy>=1.24",
  "pandas>=2.1",
  "rasterio>=1.3.5",
  "rioxarray>=0.18",
  "scipy>=1.10",
  "typer>=0.26.7",
  "xarray>=2024.10",
  "xarray-sentinel>=0.9.6",
  "zarr>=2.18.7"
]
description = "Algorithms and utilities for Synthetic Aperture Radar (SAR) sensors"
dynamic = ["version"]
license = {file = "LICENSE"}
name = "sarsen"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
lab = [
  "bokeh>=3.9.0",
  "distributed>=2024.6",
  "jupyterlab>=4.5.7",
  "jupyterlab-execute-time>=3.3.0",
  "matplotlib>=3.10.9",
  "s3fs>=2026.4.0"
]

[project.scripts]
sarsen = "sarsen.__main__:app"

[tool.coverage.run]
branch = true

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["distributed", "py", "rasterio"]

[tool.ruff]
# Same as Black.
indent-width = 4
line-length = 88

[tool.ruff.format]
exclude = ["*.ipynb"]

[tool.ruff.lint]
exclude = ["*.ipynb"]
ignore = [
  # pydocstyle: Missing Docstrings
  "D1"
]
select = [
  # pyflakes
  "F",
  # pycodestyle
  "E",
  "W",
  # isort
  "I",
  # pydocstyle
  "D"
]

[tool.ruff.lint.pycodestyle]
max-line-length = 110

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.setuptools]
packages = ["sarsen"]

[tool.setuptools.package-data]
sarsen = ["py.typed"]

[tool.setuptools_scm]
fallback_version = "999"
write_to = "sarsen/version.py"
write_to_template = '''
# Do not change! Do not track in version control!
__version__ = "{version}"
'''

[tool.uv]
# Wait before upgrading to the newest versions to avoid
# regressions and supply-chain attacks
exclude-newer = "7 days"
exclude-newer-package = {"xarray-sentinel" = false}

[tool.uv.sources]
xarray-sentinel = {git = "https://github.com/bopen/xarray-sentinel"}

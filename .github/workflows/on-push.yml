name: on-push

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-code:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.13.7
        enable-cache: true
    - name: Run pre-commit and deptry
      run: make check-code

  run-unit-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.13.7
        enable-cache: true
    - name: Run unit tests
      run: make unit-tests COV_REPORT=xml

  check-typing:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.13.7
        enable-cache: true
    - name: Run type checks
      run: make check-typing

  test-minimum-python:
    needs: [check-code, run-unit-tests, check-typing]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.13.7
        enable-cache: true
        python-version: '3.11'
    - name: Run unit tests with the minimum supported python version
      run: make unit-tests COV_REPORT=xml

  test-minimum-versions:
    needs: [check-code, run-unit-tests, check-typing]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.13.7
        enable-cache: true
        python-version: '3.11'
    - name: Run tests with the minimum supported versions
      run: make test-minimum-versions

  build-docs:
    needs: [test-minimum-python, test-minimum-versions]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.13.7
        enable-cache: true
    - name: Build documentation
      run: make build-docs

  build-distribution:
    needs: [test-minimum-python, test-minimum-versions]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: 0.13.7
        enable-cache: true
    - name: Build distribution
      run: uv build
    - name: Check distribution
      run: |
        uvx twine check --strict dist/*
        uv run --isolated --no-project --with dist/sarsen-*.whl python -c "import sarsen"
    - uses: actions/upload-artifact@v7
      with:
        name: distribution
        path: dist

  upload-to-pypi:
    needs: [build-docs, build-distribution]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sarsen
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publish

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: distribution
        path: dist
    - uses: pypa/gh-action-pypi-publish@v1.14.3
      with:
        verbose: true
